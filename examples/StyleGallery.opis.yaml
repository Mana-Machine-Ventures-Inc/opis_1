$schema: "https://opis-spec.org/schema/0.1"
opis: "0.1"

component:
  id: "com.example/StyleGallery"
  name: "StyleGallery"
  version: "1.0.0"

imports:
  tokens:
    - namespace: core
      source: "./core.tokens.json"

structure:
  id: root
  type: stack
  axis: vertical
  align: stretch
  gap: "{core.spacing.500}"
  width:
    mode: fill
  maxWidth: 360
  padding: "{core.spacing.500}"

  children:
    - id: corners
      type: stack
      width:
        mode: fill
      height:
        mode: fixed
        value: 72
      padding: "{core.spacing.400}"
      style:
        fills:
          - type: solid
            color: "{core.color.surface.info}"
        radius:
          startStart: 4
          startEnd: 28
          endEnd: 4
          endStart: 28
        cornerSmoothing: 0.6
      children:
        - id: cornersLabel
          type: text
          content: Per-corner radius
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: elevation
      type: stack
      width:
        mode: fill
      padding: "{core.spacing.400}"
      style:
        background: "{core.color.surface.default}"
        radius: "{core.radius.card}"
        stroke:
          color: "{core.color.line}"
          width: 1
          align: inside
        shadows:
          - kind: drop
            x: 0
            y: 12
            blur: 28
            spread: -4
            color: "{core.color.shadow}"
          - kind: inner
            x: 0
            y: 1
            blur: 0
            color: "#ffffff"
            opacity: 0.8
      children:
        - id: elevationLabel
          type: text
          content: Drop + inner shadow, inside stroke
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: frost
      type: overlay
      width:
        mode: fill
      height:
        mode: fixed
        value: 96
      style:
        radius: "{core.radius.card}"
      children:
        - id: frostBack
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: linearGradient
                angle: 135
                stops:
                  - color: "{core.color.cover.teal}"
                    position: 0
                  - color: "{core.color.cover.indigo}"
                    position: 1
        - id: frostGlass
          type: stack
          width:
            mode: fill
          height:
            mode: fill
          padding: "{core.spacing.400}"
          style:
            fills:
              - type: solid
                color: "#ffffff"
                opacity: 0.28
            blur:
              backdrop: "{core.blur.material}"
            radius: "{core.radius.card}"
            noise:
              opacity: 0.12
          children:
            - id: frostLabel
              type: text
              content: Backdrop blur + grain
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.onAction}"

    - id: dash
      type: stack
      width:
        mode: fill
      padding: "{core.spacing.400}"
      style:
        background: "{core.color.surface.sunken}"
        radius: "{core.radius.control}"
        stroke:
          color: "{core.color.accent.info}"
          width: 2
          align: inside
          dash: [5, 4]
      children:
        - id: dashLabel
          type: text
          content: Dashed 2px stroke
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: multiply
      type: overlay
      width:
        mode: fill
      height:
        mode: fixed
        value: 72
      style:
        radius: "{core.radius.control}"
      children:
        - id: multiplyBase
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            background: "{core.color.cover.amber}"
        - id: multiplyWash
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: solid
                color: "{core.color.cover.rose}"
            mix: multiply
            opacity: 0.75

    - id: spin
      type: stack
      width:
        mode: fill
      align: center
      distribution: center
      height:
        mode: fixed
        value: 72
      children:
        - id: diamond
          type: stack
          width:
            mode: fixed
            value: 40
          height:
            mode: fixed
            value: 40
          rotation: 28
          style:
            background: "{core.color.accent.info}"
            radius: 8
            shadows:
              - kind: drop
                x: 0
                y: 6
                blur: 12
                color: "{core.color.shadow}"

    - id: clamp
      type: text
      content: "Typography can clamp to a maximum number of lines, italicize, underline, and track just as a Figma text layer would inside a sized box."
      width:
        mode: fill
      maxLines: 2
      truncate: end
      style:
        typography:
          fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
          fontSize: 14
          fontWeight: 400
          fontStyle: italic
          lineHeight: 1.45
          letterSpacing: 0.01em
          decoration: underline
        color: "{core.color.text.secondary}"
