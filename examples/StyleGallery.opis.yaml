$schema: "https://opis-spec.org/schema/0.1"
opis: "0.1"

component:
  id: "com.example/StyleGallery"
  name: "StyleGallery"
  version: "1.0.0"

imports:
  tokens:
    - namespace: core
      source: "./core.tokens.json"

structure:
  id: root
  type: stack
  axis: vertical
  align: stretch
  gap: "{core.spacing.500}"
  width:
    mode: fill
  maxWidth: 360
  padding: "{core.spacing.500}"

  children:
    - id: corners
      type: stack
      width:
        mode: fill
      height:
        mode: fixed
        value: 72
      padding: "{core.spacing.400}"
      style:
        fills:
          - type: solid
            color: "{core.color.surface.info}"
        radius:
          startStart: 4
          startEnd: 28
          endEnd: 4
          endStart: 28
        cornerSmoothing: 0.6
      children:
        - id: cornersLabel
          type: text
          content: Per-corner radius
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: strokes
      type: stack
      axis: horizontal
      align: stretch
      gap: "{core.spacing.300}"
      width:
        mode: fill
      children:
        - id: strokeInside
          type: stack
          axis: vertical
          align: center
          distribution: center
          width:
            mode: fill
          height:
            mode: fixed
            value: 72
          padding: "{core.spacing.300}"
          style:
            background: "{core.color.surface.default}"
            radius: "{core.radius.control}"
            stroke:
              color: "{core.color.accent.info}"
              width: 4
              align: inside
          children:
            - id: strokeInsideLabel
              type: text
              content: Inside
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"

        - id: strokeCenter
          type: stack
          axis: vertical
          align: center
          distribution: center
          width:
            mode: fill
          height:
            mode: fixed
            value: 72
          padding: "{core.spacing.300}"
          style:
            background: "{core.color.surface.default}"
            radius: "{core.radius.control}"
            stroke:
              color: "{core.color.accent.info}"
              width: 4
              align: center
          children:
            - id: strokeCenterLabel
              type: text
              content: Center
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"

        - id: strokeOutside
          type: stack
          axis: vertical
          align: center
          distribution: center
          width:
            mode: fill
          height:
            mode: fixed
            value: 72
          padding: "{core.spacing.300}"
          style:
            background: "{core.color.surface.default}"
            radius: "{core.radius.control}"
            stroke:
              color: "{core.color.accent.info}"
              width: 4
              align: outside
          children:
            - id: strokeOutsideLabel
              type: text
              content: Outside
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"

    - id: elevation
      type: stack
      width:
        mode: fill
      padding: "{core.spacing.400}"
      style:
        background: "{core.color.surface.default}"
        radius: "{core.radius.card}"
        stroke:
          color: "{core.color.line}"
          width: 1
          align: inside
        shadows:
          - kind: drop
            x: 0
            y: 12
            blur: 28
            spread: -4
            color: "{core.color.shadow}"
          - kind: inner
            x: 0
            y: 1
            blur: 0
            color: "#ffffff"
            opacity: 0.8
      children:
        - id: elevationLabel
          type: text
          content: Drop + inner shadow, inside stroke
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: frost
      type: overlay
      alignment:
        inline: end
        block: center
      width:
        mode: fill
      height:
        mode: fixed
        value: 160
      children:
        - id: frostBack
          type: overlay
          width:
            mode: fill
          height:
            mode: fill
          children:
            - id: frostRed
              type: media
              width:
                mode: fill
              height:
                mode: fill
              style:
                background: "{core.color.cover.rose}"
            - id: frostMark
              type: stack
              width:
                mode: fixed
                value: 88
              height:
                mode: fixed
                value: 88
              style:
                background: "#ffffff"
                radius: "{core.radius.full}"
        - id: frostGlass
          type: stack
          axis: vertical
          align: center
          distribution: center
          width:
            mode: fixed
            value: 160
          height:
            mode: fill
          style:
            fills:
              - type: solid
                color: "#ffffff"
                opacity: 0.38
            blur:
              backdrop: "{core.blur.material}"
            radius: "{core.radius.control}"
            stroke:
              color: "#ffffff"
              width: 1
              align: inside
          children:
            - id: frostLabel
              type: text
              content: Backdrop blur
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"

    - id: layerPair
      type: stack
      axis: horizontal
      align: stretch
      gap: "{core.spacing.300}"
      width:
        mode: fill
      children:
        - id: layerSharpCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: layerSharp
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 72
              style:
                radius: "{core.radius.control}"
              children:
                - id: layerSharpArt
                  type: media
                  width:
                    mode: fill
                  height:
                    mode: fill
                  style:
                    fills:
                      - type: linearGradient
                        angle: 0
                        stops:
                          - color: "{core.color.cover.amber}"
                            position: 0
                          - color: "{core.color.cover.amber}"
                            position: 0.5
                          - color: "{core.color.cover.indigo}"
                            position: 0.5
                          - color: "{core.color.cover.indigo}"
                            position: 1
            - id: layerSharpLabel
              type: text
              content: Sharp
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"

        - id: layerBlurCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: layerBlur
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 72
              style:
                radius: "{core.radius.control}"
                blur:
                  layer: "{core.blur.soft}"
              children:
                - id: layerBlurArt
                  type: media
                  width:
                    mode: fill
                  height:
                    mode: fill
                  style:
                    fills:
                      - type: linearGradient
                        angle: 0
                        stops:
                          - color: "{core.color.cover.amber}"
                            position: 0
                          - color: "{core.color.cover.amber}"
                            position: 0.5
                          - color: "{core.color.cover.indigo}"
                            position: 0.5
                          - color: "{core.color.cover.indigo}"
                            position: 1
            - id: layerBlurLabel
              type: text
              content: Layer blur
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"

    - id: progressive
      type: overlay
      alignment:
        inline: start
        block: end
      width:
        mode: fill
      height:
        mode: fixed
        value: 96
      style:
        radius: "{core.radius.card}"
      children:
        - id: progressiveArt
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: linearGradient
                angle: 160
                stops:
                  - color: "{core.color.cover.rose}"
                    position: 0
                  - color: "{core.color.cover.plum}"
                    position: 1
        - id: progressiveVeil
          type: stack
          width:
            mode: fill
          height:
            mode: fill
          style:
            blur:
              progressive:
                start: 0
                end: 28
                along: block
                from: end
        - id: progressiveLabel
          type: text
          content: Progressive blur
          width:
            mode: fill
          padding: "{core.spacing.400}"
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.onAction}"

    - id: maskClip
      type: overlay
      alignment:
        inline: start
        block: end
      width:
        mode: fill
      height:
        mode: fixed
        value: 96
      children:
        - id: maskShape
          type: stack
          mask: true
          width:
            mode: fill
          height:
            mode: fill
          style:
            radius: "{core.radius.full}"
        - id: maskArt
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: linearGradient
                angle: 115
                stops:
                  - color: "{core.color.cover.olive}"
                    position: 0
                  - color: "{core.color.cover.plum}"
                    position: 1
        - id: maskLabel
          type: text
          content: Masked to a pill
          width:
            mode: fill
          padding: "{core.spacing.400}"
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.onAction}"

    - id: maskAlpha
      type: overlay
      alignment:
        inline: start
        block: end
      width:
        mode: fill
      height:
        mode: fixed
        value: 120
      style:
        radius: "{core.radius.card}"
        background: "{core.color.surface.sunken}"
      children:
        - id: alphaShape
          type: stack
          mask: alpha
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: radialGradient
                cx: 0.5
                cy: 0.5
                stops:
                  - color: "#ffffff"
                    position: 0
                  - color: "#ffffff"
                    position: 0.42
                  - color: "#ffffff00"
                    position: 1
        - id: alphaArt
          type: media
          source: "/media/harbor.jpg"
          fit: crop
          width:
            mode: fill
          height:
            mode: fill
        - id: alphaLabel
          type: text
          content: Alpha mask
          width:
            mode: fill
          padding: "{core.spacing.400}"
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.onAction}"

    - id: maskInverse
      type: overlay
      alignment:
        inline: center
        block: center
      width:
        mode: fill
      height:
        mode: fixed
        value: 120
      style:
        radius: "{core.radius.card}"
        background: "{core.color.cover.teal}"
      children:
        - id: inverseLabel
          type: text
          content: Inverse hole
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.onAction}"
        - id: inverseShape
          type: stack
          mask: inverse
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: radialGradient
                cx: 0.5
                cy: 0.5
                stops:
                  - color: "#ffffff"
                    position: 0
                  - color: "#ffffff"
                    position: 0.34
                  - color: "#ffffff00"
                    position: 0.36
                  - color: "#ffffff00"
                    position: 1
        - id: inverseArt
          type: media
          source: "/media/harbor.jpg"
          fit: crop
          width:
            mode: fill
          height:
            mode: fill

    - id: maskVector
      type: stack
      axis: horizontal
      align: stretch
      gap: "{core.spacing.300}"
      width:
        mode: fill
      children:
        - id: starCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: starFrame
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 160
              style:
                radius: "{core.radius.control}"
                background: "{core.color.surface.sunken}"
              children:
                - id: starShape
                  type: media
                  mask: alpha
                  source: "/masks/star.svg"
                  fit: fit
                  width:
                    mode: fill
                  height:
                    mode: fill
                - id: starArt
                  type: media
                  source: "/media/harbor.jpg"
                  fit: crop
                  width:
                    mode: fill
                  height:
                    mode: fill
            - id: starLabel
              type: text
              content: SVG star
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"
        - id: blobCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: blobFrame
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 160
              style:
                radius: "{core.radius.control}"
                background: "{core.color.surface.sunken}"
              children:
                - id: blobShape
                  type: media
                  mask: alpha
                  source: "/masks/blob.svg"
                  fit: fit
                  width:
                    mode: fill
                  height:
                    mode: fill
                - id: blobArt
                  type: media
                  source: "/media/harbor.jpg"
                  fit: crop
                  width:
                    mode: fill
                  height:
                    mode: fill
            - id: blobLabel
              type: text
              content: SVG blob
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"

    - id: fitPair
      type: stack
      axis: horizontal
      align: stretch
      gap: "{core.spacing.300}"
      width:
        mode: fill
      children:
        - id: cropCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: cropFrame
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 120
              style:
                radius: "{core.radius.control}"
              children:
                - id: cropArt
                  type: media
                  source: "/media/harbor.jpg"
                  fit: crop
                  width:
                    mode: fill
                  height:
                    mode: fill
            - id: cropLabel
              type: text
              content: Crop
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"
        - id: fitCol
          type: stack
          axis: vertical
          gap: "{core.spacing.200}"
          width:
            mode: fill
          children:
            - id: fitFrame
              type: overlay
              width:
                mode: fill
              height:
                mode: fixed
                value: 120
              style:
                radius: "{core.radius.control}"
                background: "{core.color.surface.sunken}"
              children:
                - id: fitArt
                  type: media
                  source: "/media/harbor.jpg"
                  fit: fit
                  width:
                    mode: fill
                  height:
                    mode: fill
            - id: fitLabel
              type: text
              content: Fit
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.secondary}"

    - id: dash
      type: stack
      width:
        mode: fill
      padding: "{core.spacing.400}"
      style:
        background: "{core.color.surface.sunken}"
        radius: "{core.radius.control}"
        stroke:
          color: "{core.color.accent.info}"
          width: 2
          align: inside
          dash: [5, 4]
      children:
        - id: dashLabel
          type: text
          content: Dashed 2px stroke
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.primary}"

    - id: multiply
      type: overlay
      width:
        mode: fill
      height:
        mode: fixed
        value: 72
      style:
        radius: "{core.radius.control}"
      children:
        - id: multiplyBase
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            background: "{core.color.cover.amber}"
        - id: multiplyWash
          type: media
          width:
            mode: fill
          height:
            mode: fill
          style:
            fills:
              - type: solid
                color: "{core.color.cover.rose}"
            mix: multiply
            opacity: 0.75

    - id: spin
      type: stack
      width:
        mode: fill
      align: center
      distribution: center
      height:
        mode: fixed
        value: 72
      children:
        - id: diamond
          type: stack
          width:
            mode: fixed
            value: 40
          height:
            mode: fixed
            value: 40
          rotation: 28
          style:
            background: "{core.color.accent.info}"
            radius: 8
            shadows:
              - kind: drop
                x: 0
                y: 6
                blur: 12
                color: "{core.color.shadow}"

    - id: overlayPins
      type: overlay
      width:
        mode: fill
      height:
        mode: fixed
        value: 160
      style:
        radius: "{core.radius.card}"
        background: "{core.color.surface.sunken}"
      children:
        - id: pinArt
          type: media
          source: "/media/harbor.jpg"
          fit: crop
          width:
            mode: fill
          height:
            mode: fill
        - id: pinBadge
          type: stack
          pin:
            inline: end
            block: start
          margin: 8
          padding:
            inline: 8
            block: 4
          style:
            background: "{core.color.cover.rose}"
            radius: "{core.radius.full}"
          children:
            - id: pinBadgeLabel
              type: text
              content: Live
              style:
                typography: "{core.typography.caption}"
                color: "{core.color.text.onAction}"
        - id: pinCaption
          type: text
          content: Night Harbor
          pin:
            inline: start
            block: end
          margin: 12
          style:
            typography: "{core.typography.label}"
            color: "{core.color.text.onAction}"

    - id: weightRow
      type: stack
      axis: horizontal
      align: stretch
      gap: "{core.spacing.200}"
      width:
        mode: fill
      height:
        mode: fixed
        value: 56
      children:
        - id: weightOne
          type: stack
          align: center
          distribution: center
          width:
            mode: fill
            weight: 1
          style:
            background: "{core.color.surface.info}"
            radius: "{core.radius.control}"
          children:
            - id: weightOneLabel
              type: text
              content: 1
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"
        - id: weightTwo
          type: stack
          align: center
          distribution: center
          width:
            mode: fill
            weight: 2
          style:
            background: "{core.color.surface.sunken}"
            radius: "{core.radius.control}"
          children:
            - id: weightTwoLabel
              type: text
              content: 2
              style:
                typography: "{core.typography.label}"
                color: "{core.color.text.primary}"

    - id: baselineRow
      type: stack
      axis: horizontal
      align: baseline
      gap: "{core.spacing.200}"
      width:
        mode: fill
      children:
        - id: baselineIcon
          type: icon
          name: search
          kind: template
          width:
            mode: fixed
            value: 16
          height:
            mode: fixed
            value: 16
          style:
            color: "{core.color.text.secondary}"
        - id: baselineCopy
          type: text
          content: Search across albums and artists
          width:
            mode: fill
          style:
            typography: "{core.typography.body}"
            color: "{core.color.text.primary}"

    - id: flipPair
      type: stack
      axis: horizontal
      align: center
      gap: "{core.spacing.400}"
      width:
        mode: fill
      children:
        - id: flipAhead
          type: icon
          name: search
          width:
            mode: fixed
            value: 24
          height:
            mode: fixed
            value: 24
          style:
            color: "{core.color.text.primary}"
        - id: flipBack
          type: icon
          name: search
          flip: inline
          width:
            mode: fixed
            value: 24
          height:
            mode: fixed
            value: 24
          style:
            color: "{core.color.text.primary}"

    - id: richLine
      type: text
      width:
        mode: fill
      spans:
        - content: "Now playing "
        - content: "Night Harbor"
          style:
            fontWeight: 700
            color: "{core.color.text.primary}"
        - content: " — Ada Clark"
      style:
        typography: "{core.typography.body}"
        color: "{core.color.text.secondary}"

    - id: clamp
      type: text
      content: "Typography can clamp to a maximum number of lines, italicize, underline, and track just as a Figma text layer would inside a sized box."
      width:
        mode: fill
      maxLines: 2
      truncate: end
      style:
        typography:
          fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
          fontSize: 14
          fontWeight: 400
          fontStyle: italic
          lineHeight: 1.45
          letterSpacing: 0.01em
          decoration: underline
        color: "{core.color.text.secondary}"
