$schema: "https://opis-spec.org/schema/0.1"

opis: "0.1"

component:
  id: "com.example/Button"
  name: "Button"
  version: "1.0.0"

protocols:
  Action:
    description: "A labeled control that can be placed in action collections."

conformsTo:
  - Action

imports:
  tokens:
    - namespace: core
      source: "./core.tokens.json"

arguments:
  appearance:
    type: enum
    values: [solid, outline, ghost]
    default: solid
    role: variant

  kind:
    type: enum
    values: [text, icon]
    default: text
    role: variant

  size:
    type: enum
    values: [small, medium, large, xlarge]
    default: medium
    role: variant

  tone:
    type: enum
    values: [primary, secondary, destructive]
    default: primary
    role: variant

  disabled:
    type: boolean
    default: false
    role: state

  label:
    type: string
    optional: true
    role: content

  icon:
    type: component
    accepts:
      protocol: Icon
    optional: true
    role: slot

  iconPosition:
    type: enum
    values: [leading, trailing]
    default: leading

    availableWhen:
      exists: "$arguments.icon"

constraints:
  - require:
      when:
        eq: ["$arguments.kind", text]

      then:
        exists: "$arguments.label"

  - forbid:
      all:
        - eq: ["$arguments.kind", icon]
        - not:
            exists: "$arguments.icon"

structure:
  id: root
  type: stack
  axis: horizontal
  align: center
  distribution: center

  gap:
    match:
      on: "$arguments.kind"
      cases:
        text: "{core.spacing.200}"
        icon: 0

  height:
    match:
      on: "$arguments.size"
      cases:
        small:
          mode: fixed
          value: "{core.control.height.small}"
        medium:
          mode: fixed
          value: "{core.control.height.medium}"
        large, xlarge:
          mode: fixed
          value: "{core.control.height.large}"

  width:
    match:
      on: "$arguments.kind"
      cases:
        text:
          mode: intrinsic
        icon:
          match:
            on: "$arguments.size"
            cases:
              small:
                mode: fixed
                value: "{core.control.height.small}"
              medium:
                mode: fixed
                value: "{core.control.height.medium}"
              large, xlarge:
                mode: fixed
                value: "{core.control.height.large}"

  padding:
    match:
      on: "$arguments.kind"
      cases:
        icon: 0
        text:
          block: "{core.spacing.200}"
          inline:
            match:
              on: "$arguments.size"
              cases:
                small: "{core.spacing.300}"
                medium: "{core.spacing.400}"
                large, xlarge: "{core.spacing.500}"

  order:
    match:
      on: "$arguments.iconPosition"
      cases:
        leading:
          - icon
          - label
        trailing:
          - label
          - icon

  style:
    radius: "{core.radius.control}"
    opacity:
      match:
        on: "$arguments.disabled"
        cases:
          true: 0.45
          false: 1
    background:
      match:
        on: "$arguments.appearance"
        cases:
          solid:
            match:
              on: "$arguments.tone"
              cases:
                primary: "{core.color.action.primary}"
                secondary: "{core.color.action.secondary}"
                destructive: "{core.color.action.destructive}"
          outline: transparent
          ghost: transparent
    stroke:
      match:
        on: "$arguments.appearance"
        cases:
          solid: null
          ghost: null
          outline:
            width: 1
            align: inside
            color:
              match:
                on: "$arguments.tone"
                cases:
                  primary: "{core.color.line}"
                  secondary: "{core.color.line}"
                  destructive: "{core.color.action.destructive}"
    color:
      match:
        on: "$arguments.appearance"
        cases:
          solid:
            match:
              on: "$arguments.tone"
              cases:
                primary: "{core.color.text.onAction}"
                secondary: "{core.color.text.primary}"
                destructive: "{core.color.text.onAction}"
          outline:
            match:
              on: "$arguments.tone"
              cases:
                primary: "{core.color.text.primary}"
                secondary: "{core.color.text.primary}"
                destructive: "{core.color.action.destructive}"
          ghost:
            match:
              on: "$arguments.tone"
              cases:
                primary: "{core.color.action.primary}"
                secondary: "{core.color.text.primary}"
                destructive: "{core.color.action.destructive}"

  children:
    - id: icon
      type: slot
      source: "$arguments.icon"

    - id: label
      type: text
      content: "$arguments.label"
      hidden:
        match:
          on: "$arguments.kind"
          cases:
            text: false
            icon: true

      style:
        typography: "{core.typography.button}"
        color: inherit
